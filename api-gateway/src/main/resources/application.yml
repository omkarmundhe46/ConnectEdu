#               added because event service not work with port 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route for User Service (no change)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**, /api/users/**, /internal/api/users/**

        # --- START OF FIX ---
        # 1. MOST SPECIFIC: The Discussion Service route must come first.
        # It matches URLs containing /discussions/
        - id: discussion-service
          uri: lb://discussion-service
          predicates:
            - Path=/api/clubs/{clubId}/events/{eventId}/discussions/**

        # --- START OF FIX ---
        # 1. More specific route for Event Service (MUST COME FIRST)
        # This route matches URLs that have /events/ in them.
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/clubs/{clubId}/events/**, /internal/api/events/**, /api/events/upcoming

        # 2. General route for Club Service (comes after the more specific one)
        # This route will now only handle requests for clubs themselves.
        - id: club-service
          uri: lb://club-service
          predicates:
            - Path=/api/clubs/**, /internal/api/clubs/**
        # --- END OF FIX ---



        # Route for Certificate Service (No changes needed)
        - id: certificate-service
          uri: lb://certificate-service
          predicates:
            - Path=/api/certificates/**