server:
  port: 8080
  forward-headers-strategy: framework

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route for User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**, /api/users/**, /internal/api/users/**, /oauth2/**, /login/oauth2/**, /login
          filters:
            - PreserveHostHeader # CRITICAL: Passes the Ngrok host to user-service

        - id: discussion-service-websocket
          uri: lb:ws://discussion-service # Note: 'lb:ws://'
          predicates:
            - Path=/ws/**

        - id: upload-service
          uri: lb://discussion-service
          predicates:
              - Path=/api/uploads/**


        - id: discussion-service
          uri: lb://discussion-service
          predicates:
            - Path=/api/clubs/{clubId}/events/{eventId}/discussions/**, /internal/api/discussions/**


        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/clubs/{clubId}/events/**, /internal/api/events/**, /api/events/upcoming, /api/events/my-registrations, /api/events/search, /api/analytics/**


        - id: club-service
          uri: lb://club-service
          predicates:
            - Path=/api/clubs/**, /internal/api/clubs/**, /api/banners/**


        - id: certificate-service
          uri: lb://certificate-service
          predicates:
            - Path=/api/certificates/**


        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**