spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "https://toniest-wilda-unfabulously.ngrok-free.dev/login/oauth2/code/google"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile
            provider: facebook
            redirect-uri: "https://toniest-wilda-unfabulously.ngrok-free.dev/login/oauth2/code/facebook"
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture.type(large)
            user-name-attribute: id

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000
  oauth2:
    redirect-uri: connectedu://login

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

logging:
  level:
    com.campusconnect.userservice.client.NotificationClient: DEBUG
    org.springframework.cloud.openfeign: DEBUG

NOTIFICATION_SERVICE_URL: http://localhost:8085